<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carrito — SanteBio</title>
<link rel="icon" type="image/png" href="wp-content/uploads/2026/03/logo-transparente.webp" />
<link rel="stylesheet" href="assets/shop.css" />
</head>
<body>
<header class="sb-header">
  <a class="sb-logo-link" href="index.html">
    <img class="sb-logo" src="wp-content/uploads/2026/03/logo-transparente.webp" alt="SanteBio - Cápsulas de Nopal" />
  </a>
  <div class="sb-header-actions">
    <a class="sb-tienda-link sb-header-icon-link" href="tienda.html" aria-label="Ir a la tienda"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 8h14l1 12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 8V7a4 4 0 0 1 8 0v1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
    <a class="sb-cart-link sb-header-icon-link" href="carrito.html" aria-label="Ver carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
      <span class="sb-cart-badge">0</span>
    </a>
    <a class="sb-account-link sb-header-icon-link" href="cuenta.html" aria-label="Mi cuenta"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0z"/></svg></a>
  </div>
</header>

<section class="sb-hero">
  <div class="sb-eyebrow">Carrito</div>
  <h1>Tu carrito</h1>
  <p class="sb-subhead">Revisa tu pedido antes de continuar.</p>
  <div class="sb-steps">
    <div class="sb-step is-active"><span class="sb-step-num">1</span> Carrito</div>
    <div class="sb-step-sep"></div>
    <div class="sb-step"><span class="sb-step-num">2</span> Datos</div>
    <div class="sb-step-sep"></div>
    <div class="sb-step"><span class="sb-step-num">3</span> Pago</div>
  </div>
</section>

<main>
  <section class="sb-section">
    <div class="sb-section-inner">
      <div id="sb-cart-content"></div>
    </div>
  </section>
</main>

<footer class="sb-footer">
  <div class="sb-footer-links">
    <a href="mailto:hola@capsulasdenopal.com">hola@capsulasdenopal.com</a>
    <a href="https://wa.me/524771108120">477 110 8120</a>
    <a href="seguimiento.html">Rastrear mi pedido</a>
  </div>
  <div class="sb-footer-social">
    <a href="https://www.facebook.com/share/18crX3QKti/?mibextid=wwXIfr" aria-label="Síguenos en Facebook">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
    </a>
    <a href="https://www.instagram.com/capsulasdenopalsantebio" aria-label="Síguenos en Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    </a>
  </div>
  <small>Aviso de Privacidad · © 2026 SanteBio</small>
</footer>

<script src="assets/cart.js"></script>
<script src="assets/auto-reload.js"></script>
<script>
function money(n) {
  return SanteBioCart.formatMXN(n);
}

function render() {
  var cart = SanteBioCart.getCart();
  var container = document.getElementById('sb-cart-content');

  if (cart.length === 0) {
    container.innerHTML =
      '<div class="sb-empty-cart sb-reveal">' +
      '<svg viewBox="0 0 32 32" fill="currentColor"><path d="M9 11V9a7 7 0 0 1 14 0v2h4.2a1.5 1.5 0 0 1 1.49 1.67l-1.8 16A1.5 1.5 0 0 1 25.4 30H6.6a1.5 1.5 0 0 1-1.49-1.33l-1.8-16A1.5 1.5 0 0 1 4.8 11H9zm2 0h10V9a5 5 0 0 0-10 0v2z"/></svg>' +
      '<p>Tu carrito está vacío.</p>' +
      '<a class="sb-btn" href="tienda.html">Ir a la tienda</a>' +
      '</div>';
    setupReveal();
    return;
  }

  var itemsHtml = cart.map(function (item) {
    return (
      '<div class="sb-cart-item" data-id="' + item.id + '">' +
      '<img src="' + item.image + '" alt="' + item.name + '" />' +
      '<div>' +
      '<div class="sb-item-name">' + item.name + '</div>' +
      '<div class="sb-item-price">' + money(item.price) + ' c/u</div>' +
      '</div>' +
      '<div class="sb-qty">' +
      '<button class="sb-qty-minus" aria-label="Quitar uno">−</button>' +
      '<span>' + item.qty + '</span>' +
      '<button class="sb-qty-plus" aria-label="Agregar uno">+</button>' +
      '</div>' +
      '<button class="sb-remove">Quitar</button>' +
      '</div>'
    );
  }).join('');

  var subtotal = SanteBioCart.cartTotal();

  container.innerHTML =
    '<div class="sb-cart-layout">' +
    '<div class="sb-cart-items-card sb-reveal">' + itemsHtml + '</div>' +
    '<div class="sb-summary-card sb-reveal">' +
    '<h3>Resumen del pedido</h3>' +
    '<div class="sb-summary-row"><span>Subtotal</span><span>' + money(subtotal) + '</span></div>' +
    '<div class="sb-summary-row"><span>Envío</span><span class="sb-shipping-free">Gratis</span></div>' +
    '<div class="sb-cart-summary"><span>Total</span><span>' + money(subtotal) + '</span></div>' +
    '<div class="sb-cart-actions" style="flex-direction: column;">' +
    '<button class="sb-btn" id="sb-checkout" style="width: 100%;">Finalizar compra</button>' +
    '<a class="sb-btn sb-btn-ghost" href="tienda.html" style="width: 100%;">Seguir comprando</a>' +
    '</div>' +
    '<p class="sb-note"><button class="sb-remove" id="sb-clear-cart">Vaciar carrito</button></p>' +
    '<p class="sb-note">Demo interna — el paso de pago todavía no está conectado.</p>' +
    '</div>' +
    '</div>';

  container.querySelectorAll('.sb-qty-minus').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.closest('.sb-cart-item').dataset.id;
      var item = SanteBioCart.getCart().find(function (i) { return i.id === id; });
      if (item.qty <= 1) { SanteBioCart.removeFromCart(id); } else { SanteBioCart.updateQty(id, item.qty - 1); }
      render();
    });
  });
  container.querySelectorAll('.sb-qty-plus').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.closest('.sb-cart-item').dataset.id;
      var item = SanteBioCart.getCart().find(function (i) { return i.id === id; });
      SanteBioCart.updateQty(id, item.qty + 1);
      render();
    });
  });
  container.querySelectorAll('.sb-remove:not(#sb-clear-cart)').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.closest('.sb-cart-item').dataset.id;
      SanteBioCart.removeFromCart(id);
      render();
    });
  });
  var clearBtn = document.getElementById('sb-clear-cart');
  if (clearBtn) clearBtn.addEventListener('click', function () { SanteBioCart.clearCart(); render(); });
  var checkoutBtn = document.getElementById('sb-checkout');
  if (checkoutBtn) checkoutBtn.addEventListener('click', function () {
    window.location.href = 'datos.html';
  });

  setupReveal();
}

function setupReveal() {
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.sb-reveal:not(.is-visible)').forEach(function (el) { observer.observe(el); });
}

render();
</script>
</body>
</html>
